{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | InsightHub</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <link rel="stylesheet" href="{% static 'account/css/register.css' %}">
</head>

<body class="bg-light">


<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold fs-5" href="/">InsightHub</a>
        <a href="{% url 'my-login' %}" class="btn btn-outline-dark">Login</a>
    </div>
</nav>


<section class="container d-flex align-items-center justify-content-center min-vh-100">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow-sm border-0 p-4 register-card">

        
            <div class="text-center mb-4">
                <h2 class="fw-bold">Create your account</h2>
                <p class="text-muted">Start your learning journey</p>
            </div>

    
            <form method="POST" autocomplete="off">

                {% csrf_token %}

            
                {{ RegisterForm|crispy }}

                
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" required id="consent">
                    <label class="form-check-label small text-muted" for="consent">
                        I agree to the <a href="#">Privacy Policy</a> and consent to data processing.
                    </label>
                </div>

                
                <div class="d-grid mt-4">
                    <button class="btn btn-success btn-lg btn-main">
                        Create Account
                    </button>
                </div>

            </form>

            
            <div class="text-center mt-4">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'my-login' %}" class="fw-semibold text-decoration-none ms-1">
                    Login
                </a>
            </div>

        </div>

    </div>

</section>

<script src="{% static 'account/js/register.js' %}"></script>

</body>
</html>
