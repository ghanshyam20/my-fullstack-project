{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | InsightHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-sm p-4" style="max-width: 420px; width:100%; border-radius:12px;">

        <h4 class="text-center mb-3">Forgot Password</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} small text-center fw-semibold rouded-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">
                    Send OTP
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'my-login' %}" class="small text-decoration-none">
                Back to login
            </a>
        </div>

    </div>

</div>

</body>
</html>
