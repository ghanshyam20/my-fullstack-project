{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | InsightHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-sm p-4" style="max-width: 420px; width:100%; border-radius:12px;">

        <h4 class="text-center mb-2">OTP Verification</h4>
        <p class="text-center small text-muted mb-3">
            Enter the 6-digit code sent to your email
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger small text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="otp" class="form-control text-center"
                       placeholder="Enter OTP"
                       maxlength="6"
                       required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">
                    Verify OTP
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'forgot-password' %}" class="small text-decoration-none">
                Resend OTP
            </a>
        </div>

    </div>

</div>

</body>
</html>
