{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | InsightHub</title>

    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- icons  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    
    <link rel="stylesheet" href="{% static 'account/css/login.css' %}">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card bg-white shadow p-4">

        <h3 class="text-center mb-3">Login</h3>

        <!--  for Error -->
        {% if LoginForm.errors %}
        <div class="alert alert-danger text-center small">
            Invalid email or password
        </div>
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <!--  for Email -->
            <div class="mb-3">
                {{ LoginForm.username|as_crispy_field }}
            </div>

            <!--  for Password -->
            <div class="mb-3 position-relative">
                {{ LoginForm.password|as_crispy_field }}

                <i class="bi bi-eye-slash toggle-password"
                   data-target="id_password"></i>
            </div>

            <!-- Button -->
            <div class="d-grid">
                <button class="btn btn-success btn-login">Login</button>
            </div>

        </form>

    
        <div class="text-center mt-3">
            <small class="text-muted">Don't have an account?</small>
            <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">Sign up</a>
        </div>

    </div>

</div>

<!-- script js  -->
<script src="{% static 'account/js/login.js' %}"></script>

</body>
</html>
