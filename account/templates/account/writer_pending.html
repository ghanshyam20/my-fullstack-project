{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'account/css/pending.css' %}">
</head>

<body class="bg-light">

<!-- top bar  -->
<div class="container py-3 d-flex justify-content-between align-items-center">
    <span class="fw-semibold">InsightHub</span>
    <a href="{% url 'user-logout' %}" class="btn btn-sm btn-outline-danger">Logout</a>
</div>

<!-- main -->
<div class="d-flex align-items-center justify-content-center main-area">

    <div class="card shadow-sm border-0 p-4 text-center pending-card">

        <!-- tittle  -->
         <p class="small text-muted">Hi {{ request.user.first_name }}</p>
        <h4 class="fw-semibold mb-2">Application under review</h4>

        <!-- normal text -->
        <p class="text-muted small mb-3">
            Your writer request has been received.
        </p>

        <p class="text-muted small mb-4">
            We are reviewing it now.  
            Access will be granted once approved.
        </p>

        <!-- status  -->
        <div class="status-line mb-4">
            Pending approval
        </div>

        <!-- actions -->
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-dark w-50 btn-sm">Home</a>
            <a href="{% url 'user-logout' %}" class="btn btn-danger w-50 btn-sm">Logout</a>
        </div>

    </div>

</div>

</body>
</html>
