 {% extends 'writer/navbar.html' %}



 {% block content %}

 <br>
 {% for article in AllArticles %}

 <div class="container bg-white shadow-md p-5 form-layout ">

    <h3>{{article.title}}</h3>
    {{article.content}}

    <br> <br>

    {{article.date_posted}}

    <br> <br>

    <a href="{% url 'update-article' article.id %}"class="btn btn-sm btn-outline-primary me-2"> Update article</a>

    <a href="{% url 'delete-article' article.id %}" class="btn btn-sm btn-outline-danger"> Delete article</a>
 </div>

 <br>

 {% endfor %}

 {% endblock content %}
