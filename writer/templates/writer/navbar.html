{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'writer/css/create_article.css' %}">
    <link rel="stylesheet" href="{% static 'writer/css/myarticle.css' %}">

</head>

<body>

<div class="d-flex">

  
    <div class="bg-dark text-white p-3" style="width: 220px; min-height: 100vh;">

        <h5 class="mb-4">InsightHub</h5>

        <ul class="nav flex-column">

            <li class="nav-item mb-2">
                <a href="{% url 'writer-dashboard' %}" class="nav-link text-white">Dashboard</a>
            </li>

            <li class="nav-item mb-2">
                <a href="{% url 'create-article' %}" class="nav-link text-white">Create Article</a>
            </li>

            <li class="nav-item mb-2">
                <a href="{% url 'my-articles' %}" class="nav-link text-white">My Articles</a>
            </li>

            <li class="nav-item mb-2">
                <a href="{% url 'profile-page' %}" class="nav-link text-white">Account</a>
            </li>

            <li class="nav-item mt-4">
                <a href="{% url 'user-logout' %}" class="nav-link text-danger">Logout</a>
            </li>

        </ul>

    </div>


    <div class="flex-grow-1 p-4 bg-light">

        <div class="container mt-3">
           {% if messages %}
            <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-hide">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
            {% endif %}
</div>

        {% block content %}

        {% endblock %}

    </div>

</div>

{% block scripts %}
<script src="{% static 'js/update_article.js' %}"></script>
<script src="{% static 'writer/js/main.js' %}"></script>
{% endblock %}

</body>
</html>
